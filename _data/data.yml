career-profile:
  title: Professional Profile
  summary: |
    Software engineer with **10+ years** building and maintaining business-critical web applications in **healthcare, insurance and laboratory** environments.

    Started as a Java full stack developer and now focus on **frontend with React** in **Kubernetes-based** platforms. I care about code that stays maintainable, solid testing and sharing knowledge with the team.

    **AI enthusiast:** I closely follow the latest developments and like to put them into practice. This very CV was redesigned using AI-assisted tooling.

