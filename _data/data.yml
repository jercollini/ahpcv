experiences:
  title: Professional Experience
  info:
    - role: Software Engineer (Frontend)
      time: Sep 2025 - Present
      company: Capgemini for Roche
      details: |
        - Frontend development of a **platform application for laboratory instruments**.
        - Build, deploy and test in a **Kubernetes** environment, using local **kind** clusters.
      technologies: React, JavaScript, Kubernetes, kind, Git
    - role: Fullstack Software Engineer
      time: 2019 - Sep 2025
      company: Stacks for Cegedim Santé
      details: |
        Part of the team that maintains and evolves *Mon Logiciel Médical*, a medical practice management application used by healthcare professionals.

        - **Digital transformation:** led the introduction of **new technologies** (React) and the **performance optimisation** and refactoring of existing code.
        - **Full stack ownership:** incident resolution and maintenance of frontend and backend (Java 7/8/17, Spring Boot, Hibernate, Oracle).
        - **Quality:** code reviews, delivery standards and a focus on a smooth end-user experience.
        - **Mentoring:** onboarding of new team members and promotion of good development practices.
      technologies: React, Java 7/8/17, Spring Boot, Hibernate, JavaScript, jQuery, JSP, REST, Oracle, Kubernetes, Git, Jenkins, Jira
    - role: Fullstack Java Developer
      time: 2017 - 2019
      company: Sopra Steria for Allianz
      details: |
        - Developed web applications in **Scrum** teams and handled incident management and optimisation of existing systems.
        - Created a **Maven archetype** that standardised and sped up the start of new projects.
      technologies: Java 7, Hibernate, Spring MVC, JavaScript, jQuery, JSP/JSTL, REST, SQL, Git, Jenkins, Jira
    - role: Fullstack Java Developer
      time: 2015 - 2017
      company: Setting Consultoría for Banc de Sang i Teixits (Healthcare)
      details: |
        - Requirements analysis and solution design for the blood and tissue bank information systems.
        - Backend with Struts, Spring and Hibernate; user interfaces with JSF, PrimeFaces and JavaScript.
        - Performance improvements and issue resolution in existing applications.
      technologies: Java 4/7, Struts, Spring, Hibernate, JPA, JSF, PrimeFaces, JavaScript, PL/SQL, Oracle
    - role: IT Support and Systems Technician
      time: 2006 - 2015
      company: Asepeyo (remote support), Uniland, Telefónica Soluciones, Consejo General del Poder Judicial and others
      details: |
        Remote and on-site support, helpdesk and network maintenance. The technical base that led me into software development.

